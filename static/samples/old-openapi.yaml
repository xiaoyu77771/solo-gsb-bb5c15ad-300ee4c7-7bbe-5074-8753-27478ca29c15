openapi: "3.0.3"
info:
  title: Petstore API
  version: 1.0.0
  description: 线上旧版本（示例）
servers:
  - url: https://api.example.com/v1
paths:
  /pets:
    get:
      operationId: listPets
      summary: 宠物列表
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
        - name: tag
          in: query
          required: false
          schema:
            type: string
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 宠物列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      operationId: createPet
      summary: 创建宠物
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetCreate"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: 参数错误
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getPet
      summary: 宠物详情
      responses:
        "200":
          description: 宠物详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
            application/xml:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: 不存在
    delete:
      operationId: deletePet
      summary: 删除宠物
      security:
        - apiKey: []
      responses:
        "204":
          description: 已删除
        "404":
          description: 不存在
  /admin/audit:
    get:
      operationId: getAudit
      summary: 审计日志
      responses:
        "200":
          description: 审计结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: string
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    Pet:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
          enum: [available, pending, sold]
        category:
          $ref: "#/components/schemas/Category"
        tags:
          type: array
          items:
            type: string
        owner:
          $ref: "#/components/schemas/Owner"
    PetCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        status:
          type: string
          enum: [available, pending, sold]
        tag:
          type: string
    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        parentPet:
          $ref: "#/components/schemas/Pet"
    Owner:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        pets:
          type: array
          items:
            $ref: "#/components/schemas/Pet"
